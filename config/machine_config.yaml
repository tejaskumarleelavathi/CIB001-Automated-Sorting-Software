# CIB Automated Sorting Cell — Machine Configuration
# Edit this file when hardware changes (IPs, ports, timing, camera settings).
# Do NOT modify during a run.
# Deploy to: C:\LabAutomation\config\machine_config.yaml

robot:
  ip: "172.16.9.15"
  port: 2000
  connect_timeout_s: 5.0
  motion_timeout_s: 120.0   # 2 min — robot moves at 5% speed, long travel ~60s
  command_timeout_s: 120.0  # alias required by validator — same as motion_timeout_s
  # Z heights (mm) — documented here for reference; hardcoded in sort_server.prg
  z_safe_mm: -47.700        # safe travel Z when moving between XY positions
  z_imaging_mm: -58.660     # EoA imaging Z (robot stops here, camera captures)
  # Quadrant-based U (wrist) angle selection — lets the arm reach every quadrant
  # of the dish. Computed 2026-08-05 by transforming the overhead image's pixel
  # midline through calibration_overhead_tooloffset.npy: it maps to an almost
  # perfectly constant robot Y (~297.7-299.1mm) regardless of X, so a single
  # robot-Y threshold is sufficient (see cib/config/loader.py RobotConfig).
  # u_top_deg/u_bottom_deg measured by hand via hardware_tests/test_quadrant_u_select.py.
  # All three optional — omit to disable quadrant U-selection (MOVE_IMAGE keeps
  # holding whatever U the robot is currently at, the pre-2026-08-05 behavior).
  quadrant_split_y_mm: 298.4   # robot Y dividing physical top/bottom quadrants
  u_top_deg: 209.0             # wrist U angle (deg) for top-2 quadrants (TL/TR)
  u_bottom_deg: 251.0          # wrist U angle (deg) for bottom-2 quadrants (BL/BR)

robot_remote:
  # Epson RC+ 7.0 Remote Ethernet — controller-level lifecycle control
  # (Login/GetStatus/Reset/SetMotorsOn/SetMotorsOff/Start/Stop). Separate
  # port from `robot:` above — that one is sort_server.prg's own custom
  # PICK/DROP protocol; this one is the controller's built-in supervisory
  # channel, no license required (unlike the paid RC+ API option).
  # Requires a one-time setup in RC+: [Setup] -> System Configuration ->
  # Controller -> Configuration -> Control Device = Remote Ethernet, and
  # [Setup] -> System Configuration -> Remote Control -> Ethernet -> port.
  # Deliberately connected briefly (login, run a short command sequence,
  # logout) rather than held open for the process lifetime — see
  # cib/core/orchestrator.py's _remote_ethernet_restart_task().
  enabled: true
  ip: "172.16.9.15"          # same controller as robot: above
  port: 5000                 # must match the Remote Control -> Ethernet page
  password: ""                # blank password confirmed working on real hardware.
                               # A blank password means anyone on this network
                               # segment can control the robot via Remote
                               # Ethernet -- worth revisiting.
  connect_timeout_s: 5.0
  command_timeout_s: 10.0

plc:
  ip: "172.16.9.11"
  port: 502
  # 100 -> 200ms (2026-08-27, real-hardware finding): reduces total Modbus
  # traffic sharing the USB-Ethernet adapter with the robot/Flexi/cameras --
  # contention from this + flexi polling was implicated in RC+ losing its
  # own connection to the controller during slow robot moves (Epson error
  # 1503/1504, "Communication disconnection... while executing a task").
  # The hardware e-stop circuit itself is a hardwired safety loop, cut
  # entirely independent of this software poll -- this only affects how
  # fast the STATUS LIGHT/UI reacts, not the actual physical stop.
  poll_interval_ms: 200
  unit_id: 1
  registers:
    status_light_mode: 0
    status_light_pattern: 1
    status_light_direction: 2
    status_light_speed: 3
    status_light_primary_color: 5
    status_light_primary_intensity: 6
    status_light_secondary_color: 7
    status_light_secondary_intensity: 8
  coils:
    status_light_demo: 0

flexi:
  ip: "172.16.9.12"
  port: 502
  # 100 -> 200ms (2026-08-27) -- see plc.poll_interval_ms comment above,
  # same reasoning. IMPORTANT: the physical e-stop/light-curtain SAFETY
  # CIRCUIT is a hardwired loop that cuts robot power instantly, entirely
  # independent of this poll -- this interval only governs how fast the
  # SOFTWARE (state machine, status light, UI) reacts/logs the event
  # after the hardware has already stopped everything. 200ms is still a
  # fast software reaction, just less network traffic than 100ms.
  poll_interval_ms: 200
  unit_id: 1
  registers:
    # Address 256 = live process I/O (25 registers). Address 2000 = static device status.
    process_io: 256
    process_io_count: 25
    status_base: 2000
    # Confirmed bit map (2026-06-19, verified via rawwatch):
    #   reg256 bit 15 = heartbeat (1Hz toggle — ignore for safety checks)
    #   reg256 bit 11 = system enabled (LOW when any fault active)
    #   Remaining bits TBD — ask David for full output map (OQ-23)
    safe_value: 0x0917    # r256 masked value when system is safe (heartbeat stripped)

overhead_camera:
  # Lucid TRI245S-CC — identified by serial, not IP.
  serial: "253102168"
  ip: ""                   # empty — cameras use LLA (169.254.x.x), discovered by serial
  exposure_us: 3000        # with backlight on.
  gain_db: 0.0
  pixel_format: "Mono8"   # grayscale — sufficient for blob detection
  max_fps: 2.0             # cap TX rate — both cameras share one USB-C Ethernet adapter

eoa_camera:
  # Lucid TRI245S-CC — identified by serial, not IP.
  serial: "253102169"
  ip: ""                   # empty — cameras use LLA (169.254.x.x), discovered by serial
  exposure_us: 24995.944          # ring-light-only frame (backlight OFF) — used for classification
  backlight_on_exposure_us: 5000  # backlight-ON verification frame — shorter exposure, AWB corrects ring-light colour cast
  gain_db: 0.0
  pixel_format: "BGR8"    # color for EoA archival images
  # EoA frame is ~70MB (BGR8 full-res) — at ~1Gbps effective wire speed that's
  # already a natural ~0.7s/frame floor, so a 1.0fps cap (was: 1.0) was adding
  # an extra ~0.3s of pure artificial wait PER FRAME on top of that, and this
  # block captures 4 frames/cycle (no_backlight archival + 2 drain + keeper).
  # The 1.0 value was sized to avoid contention with the overhead camera on
  # the shared USB-C adapter, but the two cameras never actually stream
  # concurrently (each does start_streaming()->capture->stop_streaming() in
  # its own window — confirmed 2026-08-21) so that contention doesn't occur
  # in practice. Raised to unblock the wire-speed floor; if a future change
  # ever does overlap the two streams, drop this back down.
  max_fps: 15.0

backlight:
  # Advanced Illumination DCS-100E
  ip: "172.16.9.20"
  port: 777
  current_ma: 250
  connect_timeout_s: 2.0

ring_light:
  robot_output_pin: 12    # robot digital output 4 = pipette pneumatic, 12 = ring light

pipette:
  # Novanta LMDAE572C linear actuator (Liberty MDrive) — raw MCode ASCII over TCP.
  # 172.16.9.60 confirmed 2026-08-06 against robot_programs/pipette_test.prg
  # (the working hardware test) — .16 was a different/earlier motor unit.
  interface: "tcp"
  ip: "172.16.9.60"
  port: 503
  aspirate_volume_ul: 5.0
  aspirate_speed_ul_per_s: 2.0
  dispense_volume_ul: 5.0
  dispense_speed_ul_per_s: 2.0

paths:
  db: 'C:\LabAutomation\data\picks.db'
  plate_configs: 'C:\LabAutomation\config\plate_configs'
  runs_output: 'C:\LabAutomation\data\runs'
  logs: 'C:\LabAutomation\data\logs'
  # Overhead images are saved here (debug use — not required by Austin).
  # In dev mode (USE_MOCKS=True), main.py uses output/overhead_images/ instead.
  overhead_images: 'C:\LabAutomation\data\overhead_images'
  # Raw (pre-vision, pre-annotation) overhead captures -- separate from
  # overhead_images above, which only ever holds the annotated copy.
  # 2026-09-08, operator request. Same dev-mode fallback pattern
  # (output/unprocessed_overhead/ under USE_MOCKS=True).
  unprocessed_overhead_images: 'C:\LabAutomation\data\unprocessed_overhead'

vision:
  detection_min_area_px: 50
  detection_max_area_px: 2000
  backlight_lead_time_ms: 50
  # Overhead image save settings
  overhead_save_images: false         # set true to save overhead frames (annotate+
                                       # save every cycle — even backgrounded, still
                                       # real disk/CPU cost). Disabled 2026-09-14
                                       # (operator request) to cut cycle time — this
                                       # gates BOTH the annotated overhead save and
                                       # the raw/unprocessed background save (see
                                       # main.py's overhead_save_dir /
                                       # unprocessed_overhead_save_dir wiring, same
                                       # flag for both). EoA images are unaffected
                                       # (separate eoa_save_format setting below).
  overhead_save_format: 'png'         # png (debug) or tiff (archival)
  # EoA image settings (save one TIFF per specimen — Austin requires these)
  eoa_save_format: 'tiff'
  # Visited centroid grid size (mm) — centroids within this distance are treated
  # as the same position and not re-targeted in the same run.
  # Raised from 0.5 to 0.8 (2026-09-16, operator request, real-hardware
  # finding): a specimen nudged-but-not-picked by a failed suction attempt
  # was observed drifting ~0.6-0.7mm per attempt, just past the old 0.5mm
  # radius -- so it never matched its own previous position and the
  # two-attempt limit (MAX_ATTEMPTS_PER_CENTROID, orchestrator.py) kept
  # resetting instead of accumulating, letting the same blob get tried
  # 13 times in one observed run. 0.8mm covers that drift. Tradeoff
  # accepted deliberately: two genuinely distinct specimens closer than
  # 0.8mm apart could get merged into one visited entry -- operator's
  # call that this is fine, since EoA still inspects whatever is
  # physically at that location and picks it if valid; a missed second
  # specimen just gets caught on a later overhead pass instead.
  centroid_snap_mm: 0.8

logging:
  level: "INFO"
  retention_days: 30

plate_stations:
  # Multi-station Lefty/Righty sorting cycle (2026-08-26). Optional section --
  # its absence disables multi-station mode entirely (MachineConfig.plate_stations
  # is None), falling back to the original single-plate/Righty-only cycle.
  #
  # right_home_u/left_home_u: the wrist U angle at right_home/left_home
  # (measured on real hardware). DROP must ALWAYS use the current side's
  # home U here -- never a quadrant-pick U below -- confirmed operator
  # safety rule (see cib/core/orchestrator.py's drop-U handling).
  right_home_u: 170.065
  left_home_u: 200.023
  # righty_top_u/righty_bottom_u match the existing robot.u_top_deg/
  # u_bottom_deg above (same physical quadrants, same hand) -- duplicated
  # here so all four quadrant U values live together with their Lefty
  # counterparts. lefty_top_u/lefty_bottom_u measured via
  # hardware_tests/test_quadrant_u_select.py (2026-08-26).
  righty_top_u: 209.0
  righty_bottom_u: 251.0
  lefty_top_u: 177.718
  lefty_bottom_u: 86.053
  # Station number -> side. Side determines hand (Righty for "right",
  # Lefty for "left"), which home the robot returns to between stations
  # on the same side, and which quadrant U pair is used for picking.
  # Matches config/plate_configs/plate_stations.xlsx's 4 sheets.
  stations:
    1: {side: right}
    2: {side: right}
    3: {side: left}
    4: {side: left}
